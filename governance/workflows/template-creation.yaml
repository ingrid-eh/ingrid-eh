# Template creation workflow — the machine-readable record.
#
# This file is the single place the workflow is written down. Change it only
# through `python tools/govcheck.py record-change` (or by hand plus a change
# record): `govcheck validate` fails whenever the steps differ from the last
# change record, so no change to the workflow goes unrecorded.
#
# Reconstructed 23 October 2026 from the IB-FIRST pilot files in Box
# (_template structure › report-base-library › IB Investigator's brochures ›
# IB-FIRST First investigator's brochure). Standing follows the IB-FIRST notes
# convention: ruled binds; proposed and observed are material for curation,
# never settled. Step names that no source file records are marked minted and
# wait for Ingrid's smart name.

id: WF-template-creation
title: Template creation workflow
owner: Ingrid Witherell, MPH
standing: observed
applies_to: Every report base in _template structure › report-base-library
pilot: IB-FIRST
output_folder: "<LABEL> <title>/building-blocks/"

steps:
  - id: derive-spine
    name: Derive the spine
    name_standing: minted
    level: report
    standing: observed
    output: "<LABEL>.spine.md"
    does: >-
      Derives the outline of the governed document from the governing source,
      read from inside the guidance body, never from its contents page.
    check: null
    rulings: [read-structure-from-guidance-body]
    events: []
    evidence: {box_file_id: "2541844547568", file: IB-FIRST.spine.md, run: 2026-10-21}

  - id: gather-notes
    name: Gather existing notes
    name_standing: minted
    level: report
    standing: observed
    output: "<LABEL>.notes.md"
    does: >-
      Searches EH OS for notes whose subject is the base and lists them as a
      pointer file, each with its standing. Notes stay where they are.
    check: null
    rulings: [standing-ruled-proposed-observed, pointers-not-copies]
    events: []
    evidence: {box_file_id: "2541836277526", file: IB-FIRST.notes.md, run: 2026-10-21}

  - id: study-through-rhizome
    name: Study through Rhizome
    name_standing: recorded
    level: report
    standing: observed
    output: "<LABEL>.study.md; <LABEL>.rhizome-report.md"
    does: >-
      Studies the base's sources through Rhizome AI, saves the report unedited,
      and holds every difference for Ingrid's ruling. Unfiled sources found here
      are filed in guidance-library before they can bind.
    check: null
    rulings: [research-through-rhizome, rhizome-binds-after-validation, templates-from-filed-sources-only, conflicts-ingrid-decides]
    events: [attach-rhizome-report-to-notion-row, file-new-guidance]
    evidence: {box_file_id: "2541840707636", file: IB-FIRST.study.md, run: 2026-10-21}

  - id: point-to-guidance
    name: Point to guidance
    name_standing: minted
    level: report
    standing: observed
    output: "<LABEL>.guidance.md"
    does: >-
      Writes the pointer file naming the guidance-library documents the base
      uses, each with its role. Holds no copy.
    check: null
    rulings: [pointers-not-copies, scope-is-ingrids-ruling, draft-marker-never-changes-value]
    events: [update-guidance-map]
    evidence: {box_file_id: "2541470226183", file: IB-FIRST.guidance.md, run: 2026-10-21}

  - id: map-sections-to-components
    name: Map sections to components
    name_standing: recorded
    level: report
    standing: observed
    output: "<LABEL>.components.md"
    does: >-
      Maps each spine section to an existing shared component, or records the
      gap as a component requested.
    check: Every section of the spine has a component, or its gap is recorded as a component requested
    check_standing: observed
    rulings: [templates-from-filed-sources-only, shared-components-index-only]
    events: []
    evidence: {box_file_id: "2542068906936", file: IB-FIRST.components.md, run: 2026-10-21}

  - id: route-report-unique-slots
    name: Route report-unique slots
    name_standing: recorded
    level: report
    standing: observed
    output: "<LABEL>.slots.md"
    does: >-
      Gives every slot unique to the base a route (decision, controlled
      language, algorithm or binding) and the record that route requires.
    check: No slot without a route, and every route carries the record that route requires
    check_standing: recorded
    rulings: [route-ruled-only-if-it-cites-a-ruling]
    events: []
    evidence: {box_file_id: "2542099533107", file: IB-FIRST.slots.md, run: 2026-10-22}

  - id: set-placement
    name: Set placement
    name_standing: recorded
    level: report
    standing: observed
    output: "<LABEL>.placement.md"
    does: Sets every part as pinned to its source section or flexible, with where a flexible part may move.
    check: Every part has a placement
    check_standing: recorded
    rulings: [placement-default-pinned, flexible-moves-recorded]
    events: []
    evidence: {box_file_id: "2542146135948", file: IB-FIRST.placement.md, run: 2026-10-22}

  - id: set-alteration
    name: Set alteration
    name_standing: recorded
    level: report
    standing: observed
    output: "<LABEL>.alteration.md"
    does: Sets the lock on every part and what may be altered in it.
    check: Every part names its lock and what may be altered
    check_standing: recorded
    rulings: [alteration-default-nothing]
    events: []
    evidence: {box_file_id: "2542152013935", file: IB-FIRST.alteration.md, run: 2026-10-22}

  - id: declare-overlays
    name: Declare overlays
    name_standing: recorded
    level: report
    standing: observed
    output: "<LABEL>.overlays.md"
    does: >-
      Declares the overlays the base takes, each with its switch; every part an
      overlay adds carries a route, a placement and a lock.
    check: Every overlay names its switch, and every part it adds carries a route, a placement and a lock
    check_standing: recorded
    rulings: [overlays-may-add, modality-is-an-overlay]
    events: [open-overlay-tracker-row]
    evidence: {box_file_id: "2542161340288", file: IB-FIRST.overlays.md, run: 2026-10-22}

  - id: assemble-the-base
    name: Assemble the base
    name_standing: recorded
    level: report
    standing: observed
    output: "<LABEL>.base.md"
    does: >-
      Replaces the placeholder with the assembled base: each section names its
      source passage, component pointer, placement, lock and local slots, and
      the counts reconcile with the building blocks.
    check: The counts of component pointers, components requested, local slots and overlay slots match the building blocks
    check_standing: observed
    rulings: [base-held-in-box-until-rule-and-publish]
    events: [update-base-map-status]
    evidence: {box_file_id: "2540131330871", file: IB-FIRST.base.md, run: 2026-10-22}

  - id: curate-the-base
    name: Curate the base
    name_standing: recorded
    level: report
    standing: observed
    output: null
    does: Settles draft instructions the base rests on. Named in IB-FIRST.slots.md; not yet run.
    check: null
    rulings: []
    events: []
    evidence: {box_file_id: "2542099533107", file: IB-FIRST.slots.md, run: null}

  - id: rule-and-publish
    name: Rule and publish
    name_standing: recorded
    level: report
    standing: observed
    output: "<LABEL>.base.md (becomes a pointer)"
    does: >-
      Confirms the routes and locks still proposed, commits the base to git,
      and turns the Box file into a pointer. Not yet run.
    check: null
    rulings: [base-held-in-box-until-rule-and-publish, route-ruled-only-if-it-cites-a-ruling]
    events: [commit-base-to-git, update-base-map-status, index-new-files]
    evidence: {box_file_id: "2540131330871", file: IB-FIRST.base.md, run: null}

  - id: tag-stage-and-kind
    name: Tag stage and kind
    name_standing: recorded
    level: report
    standing: ruled
    output: null
    does: Tags every part with its stage and kind. Last step of the workflow. Not yet run.
    check: null
    rulings: [tag-stage-and-kind-at-end]
    events: [apply-metatags, index-new-files]
    evidence: {box_file_id: "2542146135948", file: IB-FIRST.placement.md, run: null}

open_items:
  - id: minted-step-names
    question: >-
      Three steps carry no name in any source file: derive-spine, gather-notes
      and point-to-guidance. Their names here are minted. Give each a smart name.
  - id: order-alteration-overlays
    question: >-
      Set alteration and Declare overlays both ran on 22 October 2026 and no
      file says which came first. The overlays check needs a lock, so alteration
      is placed first here. Confirm.
  - id: curate-vs-assemble
    question: >-
      "Curate the base" is named once (IB-FIRST.slots.md). Confirm whether it is
      a separate step, and where it sits relative to Rule and publish.
  - id: component-level-steps
    question: >-
      Component-level work (literature references component; parts "set at
      component level") is named but has no steps. Confirm whether component
      level has its own workflow.
  - id: where-this-record-lives
    question: >-
      This record is held in git. Confirm whether the human-readable copy is
      also filed in Box › EH Standards › SOPs, and under what EH-STD ID.

