# Which tool does which job. The agent routes work by this table and flags
# artifacts produced with another tool.

routes:
  - job: Research (regulatory, clinical, guidance, precedent)
    tool: Rhizome AI
    mcp_prefix: mcp__Rhizome_AI__
    ruling: research-through-rhizome
    output: Rhizome report saved unedited; binds only once Ingrid validates it (rhizome-binds-after-validation)
    flag_if: A research finding cites no Rhizome conversation and no filed source
  - job: Diagrams (flows, decision trees, maps)
    tool: Lucidchart
    mcp_prefix: mcp__Lucid__
    ruling: diagrams-in-lucidchart
    output: Lucidchart document; the governed file links to it
    flag_if: A diagram is embedded as an image, Mermaid or SVG with no Lucidchart link
  - job: Filing and file reads
    tool: Box
    mcp_prefix: mcp__Box__
  - job: Indexes and libraries
    tool: Notion
    mcp_prefix: mcp__Notion__
  - job: Released bases and mods; this registry
    tool: GitHub
    mcp_prefix: mcp__github__
